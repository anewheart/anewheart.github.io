career-profile:
  title: Career Profile
  summary: |
    Ph.D. in Physics and Astronomy with extensive experience in ionospheric research, data analysis, and space-based remote sensing. Proven track record in developing space debris detection methods and evaluating data assimilation models.  Strong leadership skills demonstrated through university advocacy and published mission concepts.

