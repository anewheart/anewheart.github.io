experiences:
  title: Experiences
  info:
  - [cite_start]role: Ionospheric Researcher [cite: 19]
    [cite_start]time: September 2023 - Present [cite: 18]
    [cite_start]company: Orion Space Solutions [cite: 18]
    details: |
      - Evaluated a data assimilation model as an ionospheric forecasting tool and added features to the model in Python. [cite: 20]
      - Validated remote sensing data (40GB in netCDF format) for the NASA Commercial Satellite Data Acquisition program by comparing to existing ground- and space-based observations to climatology. [cite: 21]
      - Developed a CubeSat mission concept to examine mid- to low-latitude ionospheric irregularities. [cite: 22]
      - Used statistical methods in Python to analyze plasma wave observations and develop a space debris detection method. [cite: 23]
  - [cite_start]role: Advanced Study Program Postdoctoral Fellow [cite: 25]
    [cite_start]time: October 2022 - September 2023 [cite: 24]
    [cite_start]company: National Center for Atmospheric Research [cite: 24]
    details: |
      - Investigated the effects of geomagnetic storms using a coupled whole geospace model run on a high-performance computing system and compared these results to ground-based radar observations. [cite: 26]
      - Examined long-term changes in the upper atmosphere using a whole atmosphere model and subtracting seasonal trends using MATLAB. [cite: 27]
  - [cite_start]role: Graduate Research Assistant [cite: 29]
    [cite_start]time: August 2016 - July 2022 [cite: 28]
    [cite_start]company: Rice University [cite: 28]
    details: |
      - Used spectral methods to identify and characterize atmospheric waves in a large dataset (20-30GB per day of data in HDF5 format) from a distributed ground-based sensor network. [cite: 30]
      - Analyzed the occurrence of ionospheric irregularities using Langmuir probe data from multiple satellites (International Space Station Floating Potential Meter Unit, Swarm and DMSP). [cite: 31]
      - Examined the physical drivers behind ionospheric irregularities using model-data comparison to better forecast their occurrence. [cite: 32]
  - [cite_start]role: DREAM2 Project Intern [cite: 34]
    [cite_start]time: June 2014 - August 2016 [cite: 33]
    [cite_start]company: NASA Goddard Space Flight Center [cite: 33]
    details: |
      - Reanalyzed Apollo era plasma data from the surface of the moon and developed procedures for identifying relevant data for statistical analysis of particle spectra using MATLAB. [cite: 35]
  - [cite_start]role: Graduate Student Association Vice President of Student Advocacy [cite: 38]
    [cite_start]time: April 2020 - April 2021 [cite: 37]
    [cite_start]company: Rice University [cite: 37]
    details: |
      - Advocated for graduate student needs at the university level including university policy decisions and development projects. [cite: 39]
      - Oversaw two directors within the Graduate Student Association. [cite: 40]

